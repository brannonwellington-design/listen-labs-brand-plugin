<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F9F4EB">
<title>Seltzer Flavors Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<style>
/* ===== Listen Labs tokens — Paper theme (source: brand_data.py via references/brands/listen-labs.md) ===== */
:root {
  --content-primary: #120F08;
  --content-secondary: #6B6861;
  --content-disabled: #B6B4AF;
  --content-brand: #0021CC;
  --content-brand-contrast: #F9F4EB;
  --surface-primary: #F9F4EB;
  --surface-secondary: #EEE8DD;
  --surface-brand-primary: #0021CC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --content-primary: #F9F4EB;
    --content-secondary: #9E9B94;
    --content-disabled: #504E49;
    --content-brand: #3354FF;
    --surface-primary: #130F06;
    --surface-secondary: #201C13;
  }
}

/* ===== Page (player chrome) ===== */
html, body { margin: 0; background: var(--surface-primary); }
body {
  font-family: 'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif;
  font-weight: 400;
  color: var(--content-primary);
  container-type: inline-size;
}
.player {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding: 24px 16px;
}
.stage-frame {
  width: min(100%, 432px);
  aspect-ratio: 9 / 16;
  background: var(--surface-secondary);
}
.stage { display: block; width: 100%; height: 100%; }
.stage text { font-family: 'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; }
.controls {
  width: min(100%, 432px);
  display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 8px; align-items: center;
  font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;
}
.controls button {
  min-width: 44px; height: 44px; padding: 0 12px;
  font: inherit; color: var(--content-primary);
  background: transparent; border: 1px solid var(--content-disabled); border-radius: 8px; cursor: pointer;
}
.controls input[type=range] { width: 100%; min-width: 0; height: 44px; accent-color: var(--content-brand); }
.controls .time { color: var(--content-secondary); min-width: 88px; text-align: right; }
:focus-visible { outline: 2px solid var(--content-brand); outline-offset: 2px; }
.hint { font-size: 12px; line-height: 16px; color: var(--content-secondary); text-align: center; max-width: 432px; text-wrap: pretty; }
@container (max-width: 400px) {
  .controls { grid-template-columns: auto 1fr auto; }
  .controls .scene-btn { display: none; }
}

/* ===== Export mode (?export): bare 540×960 stage for frame capture ===== */
body.export .player { padding: 0; gap: 0; }
body.export .stage-frame { width: 540px; height: 960px; }
body.export .controls, body.export .hint { display: none; }
</style>
</head>
<body>

<!-- Player -->
<main class="player">
  <div class="stage-frame">
    <svg id="stage" class="stage" viewBox="0 0 540 960" role="img"
         aria-label="30-second vertical video: 300 seltzer drinkers ranked 20 flavors. Strawberry tops appeal, Black Cherry is picked most for a pack, and Black Cherry + Mango + Watermelon reaches 63%."></svg>
  </div>
  <div class="controls">
    <button id="prev" class="scene-btn" aria-label="Previous scene">‹</button>
    <button id="play" aria-label="Play or pause">Play</button>
    <input id="scrub" type="range" min="0" max="30" step="0.0333" value="0" aria-label="Timeline">
    <span class="time" id="time">0.0 / 30.0&#160;s</span>
    <button id="next" class="scene-btn" aria-label="Next scene">›</button>
  </div>
  <p class="hint">1080&#160;×&#160;1920 · 30&#160;fps · 30&#160;s. The MP4 is rendered frame by frame from this file.</p>
</main>

<script>
/* ============================================================
   DATA — Seltzer Water Flavor Preferences (Listen Labs demo study, n = 300).
   Reference example for the /video skill: the approved kinetic 30s cut (v3).
   Aggregate values copied from the study analysis; study identifiers and the
   participant verbatim are removed for the public repo — the quote scene shows
   a marked placeholder. When building a real video, every value comes from the
   fact sheet and the quote is the exact verbatim with its P# label.
   ============================================================ */
const DATA = {
  study: 'Seltzer Water Flavor Preferences',
  n: 300,
  flavorsTested: 20,
  weekly: [                                   // share drinking each weekly
    { label: 'Seltzer',     pct: 93 },
    { label: 'Plain water', pct: 91 },
    { label: 'Coffee',      pct: 79 },
    { label: 'Soda',        pct: 70 },
  ],
  maxdiff: [                                  // MaxDiff index, 100 = average (full sample)
    { label: 'Strawberry',   index: 148 },
    { label: 'Black Cherry', index: 132 },
    { label: 'Mango',        index: 126 },
    { label: 'Watermelon',   index: 110 },
    { label: 'Cucumber',     index: 46.7 },     // lowest of the 20
  ],
  repel: ['Cucumber', 'Cola', 'Apple', 'Coconut', 'Grapefruit'],
  weirdInSeltzerPct: 39,                      // base: named a least-favorite flavor
  quote: {
    text: ['“Placeholder —', 'the exact verbatim', 'goes here, set', 'line by line.”'],
    who: '— P#, participant label (placeholder)',
  },
  selfPick: [                                 // % of 300 including flavor in own 3-pack
    { label: 'Black Cherry', pct: 29, count: 86 },
    { label: 'Mango',        pct: 24, count: 71 },
    { label: 'Raspberry',    pct: 22, count: 67 },
    { label: 'Lime',         pct: 21, count: 64 },
    { label: 'Watermelon',   pct: 21, count: 63 },
  ],
  heavy: { n: 154, rows: [                    // MaxDiff index, daily+ drinkers
    { label: 'Strawberry',        index: 150 },
    { label: 'Raspberry',         index: 139 },
    { label: 'Orange / Mandarin', index: 136, focus: true },
    { label: 'Black Cherry',      index: 134 },
  ]},
  combosTested: 1140,
  winner: { flavors: ['Black Cherry', 'Mango', 'Watermelon'], reachPct: 63, reachCount: 188 },
};

/* ===== Knobs ===== */
const FPS = 30;                 // export frame rate
const TRANSITION = 0.4;         // seconds each wipe takes
const TITLE = DATA.study;       // credit line title
const NBSP = '&#160;';
const LINE = 2;                 // one stroke weight for all line art (brand_data.py MOTION.video.line_weight); emphasis by color, never weight

/* ===== Surfaces — the three looks the video cuts between =====
   blue  = surface-brand-primary with brand-contrast content (“blue screen”)
   light = Paper light · dark = Paper dark. Values from the brand file. */
const TH = {
  blue:  { bg: '#0021CC', fg: '#F9F4EB', fg2: '#F9F4EB', fg2Large: '#9CA3C9', grid: '#7A85B8', accent: '#F9F4EB', mute: '#9CA3C9' },
  light: { bg: '#F9F4EB', fg: '#120F08', fg2: '#6B6861', fg2Large: '#6B6861', grid: '#B6B4AF', accent: '#0021CC', mute: '#8D8D8D' },
  dark:  { bg: '#130F06', fg: '#F9F4EB', fg2: '#9E9B94', fg2Large: '#9E9B94', grid: '#504E49', accent: '#3354FF', mute: '#8D8D8D' },
};

/* ===== Geometry & helpers ===== */
const W = 540, H = 960, M = 32, R = W - M;   // content box: every horizontal chart runs M → R
const Y_BIG = 240, Y_SUB1 = 292, Y_SUB2 = 332;
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
const clamp01 = v => Math.max(0, Math.min(1, v));
const seg = (p, a, b) => clamp01((p - a) / (b - a));
const eo = t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));                 // expo out
const eio = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2); // cubic in-out
const r2 = v => Math.round(v * 100) / 100;
const fmt = v => Math.round(v).toLocaleString('en-US');
const rnd = (a, b) => { const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };
const lerp = (a, b, k) => a + (b - a) * k;

function C(cx, cy, r, o = {}) {
  if (r <= 0) return '';
  return `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(r)}" fill="${o.fill || 'none'}"` +
    (o.stroke ? ` stroke="${o.stroke}" stroke-width="${LINE}"` : '') +
    (o.op != null && o.op < 1 ? ` opacity="${r2(o.op)}"` : '') + '/>';
}
function L(x1, y1, x2, y2, stroke, sw = 1, o = {}) {
  return `<line x1="${r2(x1)}" y1="${r2(y1)}" x2="${r2(x2)}" y2="${r2(y2)}" stroke="${stroke}" stroke-width="${LINE}"` +
    (o.dash ? ` stroke-dasharray="${o.dash}"` : '') + (o.op != null && o.op < 1 ? ` opacity="${r2(o.op)}"` : '') + '/>';
}
// partial line from (x1,y1) toward (x2,y2), k in 0..1
const Lk = (x1, y1, x2, y2, k, stroke, sw, o) => (k <= 0 ? '' : L(x1, y1, lerp(x1, x2, k), lerp(y1, y2, k), stroke, sw, o));
function TX(x, y, str, size, fill, o = {}) {
  const op = o.op == null ? 1 : o.op;
  if (op <= 0) return '';
  return `<text x="${r2(x)}" y="${r2(y + (o.dy || 0))}" font-size="${size}" fill="${fill}" text-anchor="${o.anchor || 'start'}"` +
    (op < 1 ? ` opacity="${r2(op)}"` : '') + `>${str}</text>`;
}
// text entrance: fade + 24px rise
const rise = (p, a, d = 0.35) => { const k = eo(seg(p, a, a + d)); return { op: k, dy: 24 * (1 - k) }; };
function arcPath(cx, cy, r, a0, a1) { // degrees, 0 = 12 o’clock, clockwise
  const pt = a => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${r2(x0)} ${r2(y0)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r2(x1)} ${r2(y1)}`;
}
const ringPt = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];

/* Shared ring used by the “20 flavors” and “1,140 combos” scenes (match cut) */
const RING = { cx: 270, cy: 640, r: 180 };
const RING_PICK = [0, 7, 13];  // slots that become Black Cherry, Mango, Watermelon
const ringNode = k => ringPt(RING.cx, RING.cy, RING.r, -90 + k * 18);

/* ============================================================
   SCENES — each draws itself from local time p (seconds).
   enter: how the scene wipes in over the previous one.
   ============================================================ */
const SCENES = [

  /* 1 · Hook — 300 dots bloom from one */
  { id: 'hook', theme: 'blue', dur: 2.2, enter: null,
    note: `Seltzer Water Flavor Preferences · n${NBSP}=${NBSP}300`,
    draw(p, T) {
      let s = '';
      const cx = 270, cy = 640;
      const seed = eo(seg(p, 0, 0.2)) * (1 - seg(p, 0.35, 0.8));
      s += C(cx, cy, 12 * seed, { fill: T.fg });
      for (let i = 0; i < DATA.n; i++) {
        const d = 0.2 + (i / DATA.n) * 0.6, k = eo(seg(p, d, d + 0.45));
        if (k <= 0) continue;
        const a = i * GOLDEN + p * 0.3, rr = 11 * Math.sqrt(i + 0.5) * k;
        s += C(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 4, { fill: T.fg });
      }
      s += TX(M, Y_BIG, fmt(DATA.n * eo(seg(p, 0.1, 1.0))), 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, 'seltzer drinkers', 32, T.fg, rise(p, 0.25));
      s += TX(M, Y_SUB2, 'One pack reaches 63% of them.', 24, T.fg2Large, rise(p, 0.4));
      return s;
    } },

  /* 2 · Weekly habit — concentric radial bars */
  { id: 'weekly', theme: 'light', dur: 2.6, enter: { type: 'circle', x: 270, y: 640 },
    note: `n${NBSP}=${NBSP}300 · share drinking each beverage weekly`,
    draw(p, T) {
      let s = '';
      const cx = 270, cy = 640, radii = [196, 164, 132, 100];
      DATA.weekly.forEach((d, i) => {
        const r = radii[i], lead = i === 0;
        const k = eio(seg(p, 0.15 + i * 0.1, 0.95 + i * 0.1));
        if (seg(p, 0, 0.3) > 0) s += `<path d="${arcPath(cx, cy, r, 0, 270)}" fill="none" stroke="${T.grid}" stroke-width="${LINE}" opacity="${r2(seg(p, 0, 0.3))}"/>`;
        const sweep = 270 * d.pct / 100 * k;   // 270° radial bar: top-left quadrant stays free for labels
        if (sweep > 0.5) s += `<path d="${arcPath(cx, cy, r, 0, sweep)}" fill="none" stroke="${lead ? T.accent : T.mute}" stroke-width="${LINE}"/>`;
        const [ex, ey] = [cx + r * Math.sin(sweep * Math.PI / 180), cy - r * Math.cos(sweep * Math.PI / 180)];
        if (k > 0) s += C(ex, ey, lead ? 8 : 6, { fill: lead ? T.accent : T.mute });
        s += TX(cx - 12, cy - r + 5, `${d.label} ${fmt(d.pct * k)}%`, 18, lead ? T.fg : T.fg2, { anchor: 'end', ...rise(p, 0.3 + i * 0.1) });
      });
      s += TX(M, Y_BIG, `${fmt(DATA.weekly[0].pct * eo(seg(p, 0.1, 1.1)))}%`, 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, 'drink seltzer every week', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, 'Right alongside plain water.', 24, T.fg2, rise(p, 0.35));
      return s;
    } },

  /* 3 · 20 flavors, 3 slots — the ring */
  { id: 'twenty', theme: 'dark', dur: 2.0, enter: { type: 'line', dir: 'down' },
    note: `MaxDiff exercise across ${DATA.flavorsTested} candidate flavors`,
    draw(p, T) {
      let s = '';
      const pick = eo(seg(p, 0.9, 1.3));
      // triangle linking the 3 slots
      const tri = eio(seg(p, 1.0, 1.6));
      for (let j = 0; j < 3; j++) {
        const [x1, y1] = ringNode(RING_PICK[j]), [x2, y2] = ringNode(RING_PICK[(j + 1) % 3]);
        s += Lk(x1, y1, x2, y2, tri, T.accent, 2);
      }
      for (let k = 0; k < DATA.flavorsTested; k++) {
        const [x, y] = ringNode(k);
        const a = eo(seg(p, 0.1 + k * 0.03, 0.45 + k * 0.03));
        const isPick = RING_PICK.includes(k);
        if (isPick && pick > 0) s += C(x, y, lerp(14, 20, pick) * a, { fill: T.accent });
        else s += C(x, y, 14 * a, { fill: T.bg, stroke: T.fg2, sw: 1 });
      }
      s += TX(M, Y_BIG, fmt(DATA.flavorsTested * eo(seg(p, 0.1, 0.8))), 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, 'flavors on the table', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, '3 slots in the pack.', 24, T.fg2, rise(p, 0.9));
      return s;
    } },

  /* 4 · Appeal — lollipops off the 100 = average line */
  { id: 'maxdiff', theme: 'blue', dur: 3.0, enter: { type: 'circle', x: 270, y: 460 },
    note: `MaxDiff preference index · 100${NBSP}=${NBSP}average · n${NBSP}=${NBSP}300`,
    draw(p, T) {
      let s = '';
      const vals = DATA.maxdiff.map(d => d.index);
      const lo = Math.floor(Math.min(...vals) / 20) * 20, hi = Math.ceil(Math.max(...vals) / 20) * 20;
      const x0 = 176, x1 = R - 56, X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);   // plot ends where the value column begins; the figure ends at R
      const rows = [460, 520, 580, 640, 760];  // gap at 700 for the 15 unshown flavors
      const avgK = eio(seg(p, 0.1, 0.5));
      s += Lk(X(100), 430, X(100), 790, avgK, T.grid, 1);
      s += TX(X(100), 414, `Average${NBSP}=${NBSP}100`, 18, T.fg, { anchor: 'middle', ...rise(p, 0.2) });
      DATA.maxdiff.forEach((d, i) => {
        const y = rows[i], k = eio(seg(p, 0.3 + i * 0.12, 0.9 + i * 0.12)), lead = i === 0;
        const vx = lerp(X(100), X(d.index), k);
        s += TX(M, y + 6, d.label, 18, T.fg, rise(p, 0.2 + i * 0.08));
        s += Lk(X(100), y, X(d.index), y, k, T.accent, 2);
        if (k > 0) s += C(vx, y, lead ? 10 : 8, { fill: T.accent });
        s += TX(R, y + 6, d.index % 1 ? d.index.toFixed(1) : fmt(d.index), 18, T.fg,   // value column, right-aligned to the margin
          { anchor: 'end', op: seg(p, 0.7 + i * 0.12, 1.0 + i * 0.12) });
      });
      s += TX(M, 705, `+${NBSP}${DATA.flavorsTested - DATA.maxdiff.length} more flavors`, 18, T.fg, rise(p, 0.8));
      s += TX(M, Y_BIG, fmt(DATA.maxdiff[0].index * eo(seg(p, 0.1, 1.1))), 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, 'Strawberry tops appeal', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, 'Berries lead the index.', 24, T.fg2Large, rise(p, 0.35));
      return s;
    } },

  /* 5 · The spread — area-true circles */
  { id: 'spread', theme: 'light', dur: 2.0, enter: { type: 'line', dir: 'right' },
    note: `Circle area ∝ MaxDiff index (148 vs 46.7)`,
    draw(p, T) {
      let s = '';
      const top = DATA.maxdiff[0], bot = DATA.maxdiff[DATA.maxdiff.length - 1];
      const R = 140, r = R * Math.sqrt(bot.index / top.index), base = 800;
      const big = { x: M + R, y: base - R }, small = { x: 508 - r, y: base - r };
      const kb = eo(seg(p, 0.1, 0.7)), ks = eo(seg(p, 0.35, 0.95));
      s += C(big.x, big.y, R * kb, { fill: T.accent });
      s += C(small.x, small.y, r * ks, { fill: T.mute });
      s += TX(big.x, base + 36, top.label, 18, T.fg, { anchor: 'middle', ...rise(p, 0.4) });
      s += TX(big.x, base + 60, fmt(top.index), 18, T.fg2, { anchor: 'middle', ...rise(p, 0.45) });
      s += TX(small.x, base + 36, bot.label, 18, T.fg, { anchor: 'middle', ...rise(p, 0.6) });
      s += TX(small.x, base + 60, bot.index.toFixed(1), 18, T.fg2, { anchor: 'middle', ...rise(p, 0.65) });
      const ratio = top.index / bot.index;
      s += TX(M, Y_BIG, `${Math.floor(lerp(1, ratio, eo(seg(p, 0.1, 0.9))))}×`, 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, 'the appeal, top to bottom', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, 'Flavor choice is the whole game.', 24, T.fg2, rise(p, 0.35));
      return s;
    } },

  /* 6 · What repels — one line strikes five circles */
  { id: 'repel', theme: 'dark', dur: 2.4, enter: { type: 'circle', x: 429, y: 721 },
    note: 'Base: respondents who named a least-favorite flavor',
    draw(p, T) {
      let s = '';
      const y = 640, xs = [78, 174, 270, 366, 462];
      s += TX(M, 560, 'Five flavors that repel', 18, T.fg2, rise(p, 0.15));
      DATA.repel.forEach((f, i) => {
        const k = eo(seg(p, 0.1 + i * 0.06, 0.5 + i * 0.06));
        const struck = seg(p, 0.8 + i * 0.07, 0.9 + i * 0.07);
        s += C(xs[i], y, 36 * k, { fill: T.bg, stroke: struck > 0 ? T.fg2 : T.fg, sw: 1 });
        s += TX(xs[i], y + 64, f, 18, T.fg, { anchor: 'middle', ...rise(p, 0.2 + i * 0.06) });
      });
      s += Lk(M, y, R, y, eio(seg(p, 0.75, 1.25)), T.fg, 2);
      s += TX(M, Y_BIG, `${fmt(DATA.weirdInSeltzerPct * eo(seg(p, 0.1, 1.0)))}%`, 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, 'said it’s just weird in seltzer', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, 'Not a bad flavor. A wrong format.', 24, T.fg2, rise(p, 0.35));
      return s;
    } },

  /* 7 · Verbatim — kinetic quote */
  { id: 'quote', theme: 'blue', dur: 2.2, enter: { type: 'line', dir: 'up' },
    note: `Verbatim from interview · n${NBSP}=${NBSP}300`,
    draw(p, T) {
      let s = '';
      const lines = DATA.quote.text, y0 = 384, lh = 56;
      s += Lk(M, y0 - 44, M, y0 - 44 + lines.length * lh + 8, eio(seg(p, 0, 0.5)), T.fg, 2);
      lines.forEach((ln, i) => {
        s += TX(56, y0 + i * lh, ln, 40, T.fg, rise(p, 0.1 + i * 0.12, 0.3));
      });
      s += TX(56, y0 + lines.length * lh + 40, DATA.quote.who, 18, T.fg, rise(p, 0.8));
      return s;
    } },

  /* 8 · Built their own pack — dot-line bars */
  { id: 'selfpick', theme: 'light', dur: 3.0, enter: { type: 'circle', x: 56, y: 400 },
    note: `Own 3-flavor pack · % of ${DATA.n} including each flavor`,
    draw(p, T) {
      let s = '';
      const max = Math.ceil(Math.max(...DATA.selfPick.map(d => d.pct)) / 10) * 10;
      const x0 = M, x1 = R, X = v => x0 + v / max * (x1 - x0);
      DATA.selfPick.forEach((d, i) => {
        const y = 480 + i * 64, lead = i === 0, k = eio(seg(p, 0.3 + i * 0.08, 1.0 + i * 0.08));
        s += Lk(x0, y, x1, y, eio(seg(p, 0.1 + i * 0.05, 0.5 + i * 0.05)), T.grid, 1);
        s += TX(x0, y - 16, d.label, 18, lead ? T.fg : T.fg2, rise(p, 0.2 + i * 0.06));
        s += Lk(x0, y, X(d.pct), y, k, lead ? T.accent : T.mute, lead ? 2 : 1);
        if (k > 0) s += C(lerp(x0, X(d.pct), k), y, lead ? 9 : 7, { fill: lead ? T.accent : T.mute });
        s += TX(x1, y - 16, `${fmt(d.pct * k)}%`, 18, lead ? T.fg : T.fg2, { anchor: 'end', op: seg(p, 0.4 + i * 0.08, 0.7 + i * 0.08) });   // value sits above the track, right-aligned, clear of every line
      });
      s += TX(M, Y_BIG, `${fmt(DATA.selfPick[0].pct * eo(seg(p, 0.1, 1.1)))}%`, 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, 'chose Black Cherry', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, '3rd on appeal. 1st in the pack.', 24, T.fg2, rise(p, 0.35));
      return s;
    } },

  /* 9 · Daily drinkers — one axis, four dots */
  { id: 'heavy', theme: 'dark', dur: 2.6, enter: { type: 'line', dir: 'down' },
    note: `Daily drinkers, n${NBSP}=${NBSP}${DATA.heavy.n} · index, 100${NBSP}=${NBSP}average`,
    draw(p, T) {
      let s = '';
      const rows = DATA.heavy.rows, vals = rows.map(d => d.index);
      const lo = Math.floor(Math.min(...vals) / 10) * 10, hi = Math.ceil(Math.max(...vals) / 10) * 10;
      const ay = 640, X = v => M + (v - lo) / (hi - lo) * (508 - M);
      s += Lk(M, ay, 508, ay, eio(seg(p, 0.05, 0.45)), T.grid, 1);
      // label slots: [leader end y, name y, value y, anchor]
      const slots = {
        'Strawberry':        [548, 520, 538, 'end'],
        'Orange / Mandarin': [598, 570, 588, 'middle'],
        'Raspberry':         [672, 692, 710, 'start'],
        'Black Cherry':      [722, 742, 760, 'start'],
      };
      rows.forEach((d, i) => {
        const k = eo(seg(p, 0.25 + i * 0.1, 0.85 + i * 0.1));
        const x = lerp(M, X(d.index), k), [ly, ny, vy, anchor] = slots[d.label];
        const lab = seg(p, 0.75 + i * 0.1, 1.05 + i * 0.1);
        const up = ly < ay;
        s += Lk(X(d.index), up ? ay - 12 : ay + 12, X(d.index), ly, lab, T.grid, 1);
        if (k > 0) s += d.focus ? C(x, ay, 10, { fill: T.accent }) : C(x, ay, 7, { fill: T.bg, stroke: T.fg, sw: 1 });
        s += TX(X(d.index), ny, d.label, 18, T.fg, { anchor, op: lab });
        s += TX(X(d.index), vy + 4, fmt(d.index), 18, T.fg2, { anchor, op: lab });
      });
      const focus = rows.find(d => d.focus);
      s += TX(M, Y_BIG, fmt(focus.index * eo(seg(p, 0.1, 1.1))), 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, 'Orange rises with daily fans', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, 'Nearly catching Black Cherry.', 24, T.fg2, rise(p, 0.35));
      return s;
    } },

  /* 10 · 1,140 combos — triangles flicker, one settles */
  { id: 'combos', theme: 'blue', dur: 2.0, enter: { type: 'circle', x: 175, y: 640 },
    note: `Top 3 of 1,140 combos · runners-up within 1 point`,
    draw(p, T) {
      let s = '';
      // The real top combinations (report: the two runners-up reach within one point of the winner),
      // drawn one after another — runners-up stay dim, the winner draws bold.
      const RUNNERS = [[4, 0, 7], [0, 7, 16]];   // Lime + Black Cherry + Mango · Black Cherry + Mango + Raspberry
      RUNNERS.forEach((c, n) => {
        const k = eio(seg(p, 0.25 + n * 0.45, 0.6 + n * 0.45));   // seg(p, start, end)
        for (let j = 0; j < 3; j++) {
          const [x1, y1] = ringNode(c[j]), [x2, y2] = ringNode(c[(j + 1) % 3]);
          s += Lk(x1, y1, x2, y2, k, T.mute, 1);
        }
      });
      const tri = eio(seg(p, 1.3, 1.7));
      for (let j = 0; j < 3; j++) {
        const [x1, y1] = ringNode(RING_PICK[j]), [x2, y2] = ringNode(RING_PICK[(j + 1) % 3]);
        s += Lk(x1, y1, x2, y2, tri, T.fg, 2);
      }
      for (let k = 0; k < DATA.flavorsTested; k++) {
        const [x, y] = ringNode(k), a = eo(seg(p, k * 0.015, 0.25 + k * 0.015));
        const pick = RING_PICK.includes(k) ? eo(seg(p, 1.3, 1.6)) : 0;
        const runner = [4, 16].includes(k) ? 2 : 0;
        s += C(x, y, (5 + runner + 5 * pick) * a, { fill: T.fg });
      }
      const labelPos = [[270, 436, 'middle'], [410, 790, 'start'], [132, 790, 'end']];   // clear of neighbouring ring nodes
      DATA.winner.flavors.forEach((fl, i) => {
        const [x, y, anchor] = labelPos[i];
        s += TX(x, y, fl, 18, T.fg, { anchor, ...rise(p, 1.4 + i * 0.06, 0.3) });
      });
      s += TX(M, Y_BIG, fmt(DATA.combosTested * eo(seg(p, 0.1, 1.3))), 128, T.fg, rise(p, 0.05));
      s += TX(M, Y_SUB1, '3-flavor packs tested', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, 'One reached the most people.', 24, T.fg2Large, rise(p, 1.3));
      return s;
    } },

  /* 11 · Reach — 300 dots, 188 filled */
  { id: 'reach', theme: 'light', dur: 3.4, enter: { type: 'circle', x: 270, y: 650 },
    note: `Reach: own pick includes at least 1 of the 3 · n${NBSP}=${NBSP}${DATA.n}`,
    draw(p, T) {
      let s = '';
      const cols = 20, dotR = 7.5, gap = (R - M - 2 * dotR) / (cols - 1), gx = M + dotR, gy = 470;   // grid spans the content box
      const filled = Math.round(DATA.winner.reachCount * eio(seg(p, 0.7, 1.7)));
      for (let i = 0; i < DATA.n; i++) {
        const cx = gx + (i % cols) * gap, cy = gy + Math.floor(i / cols) * gap;
        const a = eo(seg(p, 0.05 + i * 0.0018, 0.35 + i * 0.0018));
        s += i < filled ? C(cx, cy, 7.5 * a, { fill: T.accent }) : C(cx, cy, 7 * a, { stroke: T.mute, sw: 1 });
      }
      s += C(M + 7.5, 856, 7.5, { fill: T.accent, op: seg(p, 1.4, 1.7) });
      s += TX(M + 24, 862, `${fmt(filled)} of ${DATA.n} reached`, 18, T.fg, { op: seg(p, 1.4, 1.7) });
      s += TX(M, Y_BIG, `${fmt(DATA.winner.reachPct * eio(seg(p, 0.7, 1.7)))}%`, 128, T.fg, rise(p, 0.7));
      s += TX(M, Y_SUB1, 'find a flavor they picked', 32, T.fg, rise(p, 0.2));
      s += TX(M, Y_SUB2, DATA.winner.flavors.join(' + '), 24, T.fg2, rise(p, 0.35));
      return s;
    } },

  /* 12 · End card — the pack, strung on a line */
  { id: 'end', theme: 'blue', dur: 2.6, enter: { type: 'line', dir: 'up' },
    note: '',
    draw(p, T) {
      let s = '';
      const y = 540, rr = 56, xs = [M + rr, W / 2, R - rr];   // outer circles touch the margins
      s += Lk(M, y, R, y, eio(seg(p, 0.1, 0.6)), T.fg, 2);
      DATA.winner.flavors.forEach((f, i) => {
        const k = eo(seg(p, 0.3 + i * 0.1, 0.8 + i * 0.1));
        s += C(xs[i], y, rr * k, { fill: T.fg });
        const lx = [M, W / 2, R][i], anchor = ['start', 'middle', 'end'][i];   // labels align to the same edges
        s += TX(lx, y + 92, f, 20, T.fg, { anchor, ...rise(p, 0.45 + i * 0.1) });
      });
      s += TX(M, 320, 'The pack.', 64, T.fg, rise(p, 0.05));
      s += TX(M, 364, `Highest reach of ${fmt(DATA.combosTested)} combos.`, 24, T.fg2Large, rise(p, 0.2));
      const w = seg(p, 0.9, 1.3);
      s += `<g transform="translate(${r2(270 - 28 * 520 / 71 / 2)} 800) scale(${r2(28 / 71 * 1000) / 1000})" opacity="${r2(w)}" fill="${T.fg}">${WORDMARK}</g>`;
      s += TX(270, 872, `${DATA.study} · n${NBSP}=${NBSP}${DATA.n}`, 16, T.fg, { anchor: 'middle', op: w });
      return s;
    } },
];

4196 499.922 43.8134L496.62 42.9211C488.856 41.0472 483.056 37.5671 483.056 29.4469C483.056 21.1482 490.552 15.705 500.993 15.705C511.344 15.705 518.126 20.1667 519.197 29.3577H510.63C509.292 25.1637 506.168 22.8437 500.725 22.8437C495.014 22.8437 492.247 25.1637 492.247 28.6438C492.247 32.4808 495.014 33.5516 500.725 35.2471L505.722 36.6748C515.092 39.3518 520 42.2072 520 50.0597C520 59.0723 512.237 64.8724 501.528 64.8724C490.106 64.8724 483.413 59.9646 481.539 49.5243Z"/>`;  // assets/listen-labs-logo.svg, viewBox 0 0 520 71

/* ===== Timeline ===== */
let acc = 0;
SCENES.forEach(s => { s.start = acc; acc += s.dur; });
const TOTAL = acc;

/* Scene layer: background, content, credit line, source note — optionally scaled for the punch-in */
function layer(scene, p, scale = 1) {
  const T = TH[scene.theme];
  const tf = scale !== 1 ? ` transform="translate(270 480) scale(${r2(scale * 1000) / 1000}) translate(-270 -480)"` : '';
  return `<g${tf}>` +
    `<rect x="-40" y="-40" width="${W + 80}" height="${H + 80}" fill="${T.bg}"/>` +
    scene.draw(p, T) +
    (scene.id === 'end' ? '' : `<text x="270" y="62" font-size="16" text-anchor="middle"><tspan fill="${T.fg2}">Listen Labs /</tspan> <tspan fill="${T.fg}">${TITLE}</tspan></text>`) +
    (scene.note ? TX(M, 912, scene.note, 16, T.fg2) : '') +
    `</g>`;
}

function frame(t) {
  t = Math.max(0, Math.min(TOTAL - 1e-6, t));
  let i = SCENES.findIndex(s => t < s.start + s.dur);
  if (i < 0) i = SCENES.length - 1;
  const s = SCENES[i], p = t - s.start;
  if (i === 0 || p >= TRANSITION || !s.enter) return layer(s, p);

  const prev = SCENES[i - 1], k = eio(p / TRANSITION), T = TH[s.theme];
  let clip, edge;
  if (s.enter.type === 'circle') {
    const { x, y } = s.enter;
    const far = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([cx, cy]) => Math.hypot(cx - x, cy - y)));
    const r = far * k;
    clip = `<circle cx="${x}" cy="${y}" r="${r2(r)}"/>`;
    edge = C(x, y, r, { stroke: T.fg, sw: 2 });
  } else {
    const d = s.enter.dir;
    if (d === 'down')  { const h = H * k; clip = `<rect x="0" y="0" width="${W}" height="${r2(h)}"/>`; edge = L(0, h, W, h, T.fg, 2); }
    if (d === 'up')    { const y = H * (1 - k); clip = `<rect x="0" y="${r2(y)}" width="${W}" height="${r2(H - y)}"/>`; edge = L(0, y, W, y, T.fg, 2); }
    if (d === 'right') { const w = W * k; clip = `<rect x="0" y="0" width="${r2(w)}" height="${H}"/>`; edge = L(w, 0, w, H, T.fg, 2); }
  }
  return `<defs><clipPath id="wipe">${clip}</clipPath></defs>` +
    layer(prev, prev.dur + p, 1 + 0.04 * k) +
    `<g clip-path="url(#wipe)">${layer(s, p, 1 + 0.06 * (1 - k))}</g>` +
    edge;
}

/* ===== Player ===== */
const stage = document.getElementById('stage');
function renderFrame(t) { stage.innerHTML = frame(t); }
window.renderFrame = renderFrame;
window.TOTAL = TOTAL;
window.FPS = FPS;

const params = new URLSearchParams(location.search);
if (params.has('export')) {
  document.body.classList.add('export');
  renderFrame(0);
} else {
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = false, cur = 0, last = 0;
  scrub.max = TOTAL;
  const show = t => { cur = t; renderFrame(t); scrub.value = t; time.textContent = `${t.toFixed(1)} / ${TOTAL.toFixed(1)} s`; };
  const tick = now => {
    if (!playing) return;
    cur += (now - last) / 1000; last = now;
    if (cur >= TOTAL) cur = 0;           // loop like a short
    show(cur);
    requestAnimationFrame(tick);
  };
  const setPlaying = on => {
    playing = on; playBtn.textContent = on ? 'Pause' : 'Play';
    if (on) { last = performance.now(); requestAnimationFrame(tick); }
  };
  playBtn.addEventListener('click', () => setPlaying(!playing));
  scrub.addEventListener('input', () => { setPlaying(false); show(+scrub.value); });
  // Scene steppers land on each scene’s settled final state (no-motion path)
  const settled = i => SCENES[i].start + SCENES[i].dur - 0.05;
  const sceneAt = t => Math.max(0, SCENES.findIndex(s => t < s.start + s.dur));
  document.getElementById('prev').addEventListener('click', () => { setPlaying(false); show(settled(Math.max(0, sceneAt(cur) - 1))); });
  document.getElementById('next').addEventListener('click', () => { setPlaying(false); show(settled(Math.min(SCENES.length - 1, sceneAt(cur) + 1))); });
  if (reduce) show(settled(0)); else { show(0); setPlaying(true); }
}
