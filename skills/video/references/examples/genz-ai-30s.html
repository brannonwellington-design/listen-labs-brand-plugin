<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F9F4EB">
<title>Gen Z AI Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<style>
/* ===== Listen Labs tokens — Paper theme (source: brand_data.py via references/brands/listen-labs.md) ===== */
:root {
  --content-primary: #120F08;
  --content-secondary: #6B6861;
  --content-disabled: #B6B4AF;
  --content-brand: #0021CC;
  --content-brand-contrast: #F9F4EB;
  --surface-primary: #F9F4EB;
  --surface-secondary: #EEE8DD;
  --surface-brand-primary: #0021CC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --content-primary: #F9F4EB;
    --content-secondary: #9E9B94;
    --content-disabled: #504E49;
    --content-brand: #3354FF;
    --surface-primary: #130F06;
    --surface-secondary: #201C13;
  }
}

/* ===== Page (player chrome) ===== */
html, body { margin: 0; background: var(--surface-primary); }
body {
  font-family: 'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif;
  font-weight: 400;
  color: var(--content-primary);
  container-type: inline-size;
}
.player {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding: 24px 16px;
}
.stage-frame {
  width: min(100%, 432px);
  aspect-ratio: 9 / 16;
  background: var(--surface-secondary);
}
.stage { display: block; width: 100%; height: 100%; }
.stage text { font-family: 'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; }
.controls {
  width: min(100%, 432px);
  display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 8px; align-items: center;
  font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;
}
.controls button {
  min-width: 44px; height: 44px; padding: 0 12px;
  font: inherit; color: var(--content-primary);
  background: transparent; border: 1px solid var(--content-disabled); border-radius: 8px; cursor: pointer;
}
.controls input[type=range] { width: 100%; min-width: 0; height: 44px; accent-color: var(--content-brand); }
.controls .time { color: var(--content-secondary); min-width: 88px; text-align: right; }
:focus-visible { outline: 2px solid var(--content-brand); outline-offset: 2px; }
.hint { font-size: 12px; line-height: 16px; color: var(--content-secondary); text-align: center; max-width: 432px; text-wrap: pretty; }
@container (max-width: 400px) {
  .controls { grid-template-columns: auto 1fr auto; }
  .controls .scene-btn { display: none; }
}

/* ===== Export mode (?export): bare 540×960 stage for frame capture ===== */
body.export .player { padding: 0; gap: 0; }
body.export .stage-frame { width: 540px; height: 960px; }
body.export .controls, body.export .hint { display: none; }
</style>
</head>
<body>

<!-- Player -->
<main class="player">
  <div class="stage-frame">
    <svg id="stage" class="stage" viewBox="0 0 540 960" role="img"
         aria-label="30-second video: two in three Gen Z participants use AI daily; ChatGPT is the default, each tool has its own job, and most keep AI strictly a tool rather than a companion."></svg>
  </div>
  <div class="controls">
    <button id="prev" class="scene-btn" aria-label="Previous scene">‹</button>
    <button id="play" aria-label="Play or pause">Play</button>
    <input id="scrub" type="range" min="0" max="30" step="0.0333" value="0" aria-label="Timeline">
    <span class="time" id="time">0.0 / 30.0&#160;s</span>
    <button id="next" class="scene-btn" aria-label="Next scene">›</button>
  </div>
  <p class="hint">1080&#160;×&#160;1920 · 30&#160;fps · 30&#160;s. The MP4 is rendered frame by frame from this file.</p>
</main>

<script>
/* ============================================================
   DATA — Gen Z ChatGPT Usage Study (Listen Labs demo study, n = 298).
   Second reference example for the /video skill: the generalization test — ten scenes
   built from the same templates and rules as the seltzer example, on different data
   shapes (multi-answer reach, per-tool bases, coded vs closed measures, a small
   subgroup, a two-month comparison). Aspect-aware: ?aspect=16x9 / --query aspect=16x9.
   Aggregate values copied from the study analysis; study identifiers and the
   participant verbatim are removed for the public repo (the quote is a marked
   placeholder). In a real video every value comes from the fact sheet.
   ============================================================ */
const DATA = {
  study: 'Gen Z ChatGPT Usage Study',
  n: 298,
  daily: { pct: 67, count: 197, base: 293 },
  reach: [                                     // past-month use, base 293, multiple answers
    { label: 'ChatGPT', pct: 96 }, { label: 'Gemini', pct: 51 }, { label: 'Copilot', pct: 24 }, { label: 'Claude', pct: 14 },
  ],
  lanes: [                                     // users = past-month users; lane = % of that tool's users
    { tool: 'ChatGPT', users: 281, pct: 81, lane: 'familiarity' },
    { tool: 'Gemini',  users: 149, pct: 66, lane: 'research' },
    { tool: 'Claude',  users: 40,  pct: 57, lane: 'quality' },
  ],
  quote: { text: '“Placeholder — the exact verbatim goes here, unedited.”', who: '— P#, participant label (placeholder)' },
  limits: { pct: 63, count: 189, base: 298 },
  attitudes: [                                 // 72 closed question (base 293); 33 and 21 coded open answers (base 298)
    { label: 'Positive overall', pct: 72, focus: true },
    { label: 'Improves work or learning', pct: 33 },
    { label: 'Worry skills weaken', pct: 21 },
  ],
  roles: [                                     // explicit mentions, base 298
    { label: 'Strictly a tool', pct: 83 },
    { label: 'Worried about dependence', pct: 15 },
    { label: 'Emotional support', pct: 9 },
    { label: 'Companion or friend', pct: 6 },
  ],
  advice: { infrequent: { pct: 28, count: 9, base: 32 }, daily: { pct: 64, count: 123, base: 192 } },
  cohorts: [                                   // June n = 86 → July n = 212
    { label: 'Daily users', jun: 64, jul: 67 },
    { label: 'Neutral', jun: 10, jul: 15 },
    { label: 'Somewhat negative', jun: 16, jul: 9 },
  ],
  workflow: ['Prompt', 'Inspect', 'Revise', 'Act'],
};

/* ===== Knobs ===== */
const FPS = 30;                 // export frame rate
const TRANSITION = 0.4;         // seconds each wipe takes
const TITLE = DATA.study;       // credit line title
const NBSP = '&#160;';
const DEFAULT_ASPECT = '9:16';  // '9:16' | '16:9' — override with ?aspect=16x9
const LINE = 2;                 // one stroke weight for all line art (brand_data.py MOTION.video.line_weight); emphasis by color, never weight

/* ===== Surfaces — the three looks the video cuts between =====
   blue  = surface-brand-primary with brand-contrast content (“blue screen”)
   light = Paper light · dark = Paper dark. Values from the brand file. */
const TH = {
  blue:  { onAccent: '#0021CC', bg: '#0021CC', fg: '#F9F4EB', fg2: '#F9F4EB', fg2Large: '#9CA3C9', grid: '#7A85B8', accent: '#F9F4EB', mute: '#9CA3C9' },
  light: { onAccent: '#F9F4EB', bg: '#F9F4EB', fg: '#120F08', fg2: '#6B6861', fg2Large: '#6B6861', grid: '#B6B4AF', accent: '#0021CC', mute: '#8D8D8D' },
  dark:  { onAccent: '#F9F4EB', bg: '#130F06', fg: '#F9F4EB', fg2: '#9E9B94', fg2Large: '#9E9B94', grid: '#504E49', accent: '#3354FF', mute: '#8D8D8D' },
};

/* ===== Aspect layouts — one composition, re-composed per ratio (brand_data.py MOTION.video canvases + safe zones, clean profile) =====
   Each layout names a text column and a figure box. Scenes draw only relative to these, so a ratio is one entry here.
   9:16 stacks text over figure; 16:9 splits the 12-column grid 6 / 6: text block left, figure right. */
const ASPECTS = {
  '9:16': {
    W: 540, H: 960, M: 32, credit: 58, note: 912,
    text: { x: 32, big: 240, l1: 292, max: 476, lh1: 40, lh2: 32 },
    fig: { x0: 32, x1: 508, y0: 420, y1: 860 },
    quote: { x: 56, y0: 384, max: 452, wrap: false },
    end: { title: [32, 320], sub: [32, 364], row: 540, rowSpan: 'content', logo: { x: 270, y: 800, anchor: 'middle' }, study: { x: 270, y: 872, anchor: 'middle' } },
  },
  '16:9': {
    W: 960, H: 540, M: 48, credit: 38, note: 512,
    text: { x: 48, big: 214, l1: 266, max: 396, lh1: 40, lh2: 32 },
    fig: { x0: 468, x1: 912, y0: 72, y1: 464 },
    quote: { x: 72, y0: 196, max: 640, wrap: true },
    end: { title: [48, 214], titleSize: 48, sub: [48, 258], row: null, rowSpan: 'fig', logo: { x: 48, y: 412, anchor: 'start' }, study: { x: 48, y: 512, anchor: 'start' } },
  },
};
const ASPECT = (new URLSearchParams(location.search).get('aspect') || DEFAULT_ASPECT).replace('x', ':');
const LAY = ASPECTS[ASPECT] || ASPECTS['9:16'];
const { W, H, M } = LAY, R = W - M;                       // content box: horizontal figures run M → R (or the figure box edges)
const F = { ...LAY.fig, w: LAY.fig.x1 - LAY.fig.x0, h: LAY.fig.y1 - LAY.fig.y0, cx: (LAY.fig.x0 + LAY.fig.x1) / 2, cy: (LAY.fig.y0 + LAY.fig.y1) / 2 };
window.CANVAS = { width: W, height: H };

/* Credit line + clearance (brand_data.py MOTION.video.credit_zone): 14px, baseline at the safe-zone top + its cap height.
   Nothing enters from the canvas top to CLEAR below the credit baseline, or within CLEAR above the source note's cap.
   Figures keep all their ink — marks and labels — inside F, and F sits between those two zones. */
const CREDIT_SIZE = 14, NOTE_SIZE = 16, CLEAR = 32;
const ZONE_TOP = LAY.credit + CLEAR, ZONE_BOTTOM = LAY.note - NOTE_SIZE * 0.73 - CLEAR;
if (F.y0 < ZONE_TOP || F.y1 > ZONE_BOTTOM) console.warn(`Figure box ${F.y0}–${F.y1} breaks the credit/note clearance ${ZONE_TOP}–${r2(ZONE_BOTTOM)}`);

/* ===== Helpers ===== */
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
const clamp01 = v => Math.max(0, Math.min(1, v));
const seg = (p, a, b) => clamp01((p - a) / (b - a));               // seg(p, start, end)
const eo = t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));            // expo out
const eio = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const r2 = v => Math.round(v * 100) / 100;
const fmt = v => Math.round(v).toLocaleString('en-US');
const lerp = (a, b, k) => a + (b - a) * k;

function C(cx, cy, r, o = {}) {
  if (r <= 0) return '';
  return `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(r)}" fill="${o.fill || 'none'}"` +
    (o.stroke ? ` stroke="${o.stroke}" stroke-width="${LINE}"` : '') +
    (o.op != null && o.op < 1 ? ` opacity="${r2(o.op)}"` : '') + '/>';
}
const L = (x1, y1, x2, y2, stroke) => `<line x1="${r2(x1)}" y1="${r2(y1)}" x2="${r2(x2)}" y2="${r2(y2)}" stroke="${stroke}" stroke-width="${LINE}"/>`;
const Lk = (x1, y1, x2, y2, k, stroke) => (k <= 0 ? '' : L(x1, y1, lerp(x1, x2, k), lerp(y1, y2, k), stroke));
function TX(x, y, str, size, fill, o = {}) {
  const op = o.op == null ? 1 : o.op;
  if (op <= 0) return '';
  return `<text x="${r2(x)}" y="${r2(y + (o.dy || 0))}" font-size="${size}" fill="${fill}" text-anchor="${o.anchor || 'start'}"` +
    (op < 1 ? ` opacity="${r2(op)}"` : '') + `>${str}</text>`;
}
const rise = (p, a, d = 0.35) => { const k = eo(seg(p, a, a + d)); return { op: k, dy: 24 * (1 - k) }; };
// Balanced wrap by estimated Inter advance (0.56em average): layouts re-wrap copy instead of shrinking type,
// and lines are evened out (text-wrap: balance) so no line ends with a single stranded word.
function greedy(str, size, max) {
  const out = []; let line = '';
  for (const w of str.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (t.replace(/&#160;/g, ' ').length * size * 0.56 > max && line) { out.push(line); line = w; } else line = t;
  }
  return line ? [...out, line] : out;
}
function wrap(str, size, max) {
  const lines = greedy(str, size, max);
  if (lines.length < 2) return lines;
  let lo = size, hi = max;                      // narrowest width that keeps the same line count
  while (hi - lo > 2) { const mid = (lo + hi) / 2; greedy(str, size, mid).length > lines.length ? lo = mid : hi = mid; }
  return greedy(str, size, hi);
}
const textW = (str, size) => str.replace(/&#160;/g, ' ').length * size * 0.56;
// Label defense for point labels on an axis: try slots (above/below, near/far) × anchors (middle/end/start) and take the
// first that stays inside the figure box and clears every label already placed. Hand-picked slots don't survive new data.
function placeLabels(items, ay, size = 18) {
  const slots = [[-70, -52], [52, 70], [-120, -102], [102, 120]];   // [name y, value y] relative to the axis
  const placed = [];
  return items.map(it => {
    const w = Math.max(textW(it.name, size), textW(it.value, size)) + 8;
    for (const [dn, dv] of slots) for (const anchor of ['middle', 'end', 'start']) {
      const x0 = anchor === 'middle' ? it.x - w / 2 : anchor === 'end' ? it.x - w : it.x;
      const box = { x0, x1: x0 + w, y0: ay + dn - size, y1: ay + dv + 4 };
      if (box.x0 < F.x0 || box.x1 > F.x1 || box.y0 < F.y0 || box.y1 > F.y1) continue;
      if (placed.some(b => !(box.x1 + 12 < b.x0 || box.x0 > b.x1 + 12 || box.y1 + 8 < b.y0 || box.y0 > b.y1 + 8))) continue;
      placed.push(box);
      return { anchor, ny: ay + dn, vy: ay + dv, ly: dn < 0 ? ay + dv + 10 : ay + dn - size - 6 };
    }
    console.warn(`No clear slot for label “${it.name}”`);
    return { anchor: 'middle', ny: ay - 70, vy: ay - 52, ly: ay - 42 };
  });
}
// The headline block every stat scene shares: big numeral, line 1, line 2 — positioned and wrapped by the layout
function head(p, T, o) {
  const t = LAY.text; let s = '';
  if (o.title) {   // a statement headline (48px) instead of a numeral, for scenes whose dominant element is the figure
    const tl = wrap(o.title, 48, t.max);
    tl.forEach((ln, i) => { s += TX(t.x, t.big + i * 56, ln, 48, T.fg, rise(p, (o.titleAt ?? 0.05) + i * 0.05)); });
    if (o.l2) wrap(o.l2, 24, t.max).forEach((ln, i) => { s += TX(t.x, t.big + (tl.length - 1) * 56 + 44 + i * t.lh2, ln, 24, o.l2Color || T.fg2, rise(p, (o.l2At ?? 0.35) + i * 0.04)); });
    return s;
  }
  if (o.big != null) s += TX(t.x, t.big, o.big, 128, T.fg, rise(p, o.bigAt ?? 0.05));
  const l1 = wrap(o.l1, 32, t.max);
  l1.forEach((ln, i) => { s += TX(t.x, t.l1 + i * t.lh1, ln, 32, T.fg, rise(p, (o.l1At ?? 0.2) + i * 0.04)); });
  if (o.l2) {
    const y2 = t.l1 + (l1.length - 1) * t.lh1 + 40;
    wrap(o.l2, 24, t.max).forEach((ln, i) => { s += TX(t.x, y2 + i * t.lh2, ln, 24, o.l2Color || T.fg2, rise(p, (o.l2At ?? 0.35) + i * 0.04)); });
  }
  return s;
}
function arcPath(cx, cy, r, a0, a1) { // degrees, 0 = 12 o’clock, clockwise
  const pt = a => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${r2(x0)} ${r2(y0)} A${r2(r)} ${r2(r)} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r2(x1)} ${r2(y1)}`;
}
const ringPt = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];

/* Geometry shared between a scene and the wipe that leaves it */
const lanesGeom = () => {
  const r1 = Math.min(F.h / 2 - 60, F.w / (2 * DATA.lanes.reduce((a, d) => a + Math.sqrt(d.users / DATA.lanes[0].users), 0) + 0.4));
  const rs = DATA.lanes.map(d => r1 * Math.sqrt(d.users / DATA.lanes[0].users));   // area ∝ users
  const gap = (F.w - 2 * rs.reduce((a, b) => a + b, 0)) / 2, base = F.cy + r1 * 0.6;
  const xs = [F.x0 + rs[0], F.x0 + 2 * rs[0] + gap + rs[1], F.x1 - rs[2]];
  return { rs, xs, base };   // circles sit on a common baseline
};
const ringGeom = () => ({ cx: F.cx, cy: F.cy, r: Math.min(F.w, F.h) / 2 - 12 });
const axisX = v => F.x0 + v / 100 * F.w;
const slopeY = v => F.y1 - 40 - v / 100 * (F.h - 100);
const dumbX = v => { const hi = Math.ceil(Math.max(...DATA.cohorts.flatMap(d => [d.jun, d.jul])) / 20) * 20; return F.x0 + v / hi * F.w; };

/* ============================================================
   SCENES — kinetic 30s, standard depth. Each a different form.
   ============================================================ */
const SCENES = [

  /* 1 · Hook — 293 answers bloom, 197 light up */
  { id: 'hook', theme: 'blue', dur: 2.6, enter: null,
    note: `Use AI daily · 197 of 293 · Gen Z, United States`,
    draw(p, T) {
      let s = '';
      const n = DATA.daily.base, sc = Math.min(1, (Math.min(F.w, F.h) / 2 - 6) / (11 * Math.sqrt(n)));
      const lit = DATA.daily.count * eo(seg(p, 1.0, 2.2));
      for (let i = 0; i < n; i++) {
        const d = 0.1 + (i / n) * 0.6, k = eo(seg(p, d, d + 0.4));
        if (k <= 0) continue;
        const a = i * GOLDEN, rr = 11 * Math.sqrt(i + 0.5) * k * sc;
        s += C(F.cx + Math.cos(a) * rr, F.cy + Math.sin(a) * rr, 4, { fill: i < lit ? T.fg : T.mute, op: i < lit ? 1 : 0.6 });
      }
      return s + head(p, T, { big: `${fmt(DATA.daily.pct * eo(seg(p, 1.0, 2.2)))}%`, bigAt: 1.0, l1: 'use AI every day', l1At: 0.2, l2: 'A utility, not an autopilot.', l2At: 0.35, l2Color: T.fg2Large });
    } },

  /* 2 · Reach — 270° radial bars */
  { id: 'reach', theme: 'light', dur: 3.0, enter: { type: 'circle', at: () => [F.cx, F.cy] },
    note: `Past-month use · n${NBSP}=${NBSP}293 · multiple answers`,
    draw(p, T) {
      let s = '';
      const sc = Math.min(1, (Math.min(F.w, F.h) / 2 - 10) / 196);
      DATA.reach.forEach((d, i) => {
        const r = [196, 164, 132, 100][i] * sc, lead = i === 0, k = eio(seg(p, 0.15 + i * 0.1, 1.0 + i * 0.1));
        if (seg(p, 0, 0.3) > 0) s += `<path d="${arcPath(F.cx, F.cy, r, 0, 270)}" fill="none" stroke="${T.grid}" stroke-width="${LINE}" opacity="${r2(seg(p, 0, 0.3))}"/>`;
        const sweep = 270 * d.pct / 100 * k;
        if (sweep > 0.5) s += `<path d="${arcPath(F.cx, F.cy, r, 0, sweep)}" fill="none" stroke="${lead ? T.accent : T.mute}" stroke-width="${LINE}"/>`;
        if (k > 0) s += C(F.cx + r * Math.sin(sweep * Math.PI / 180), F.cy - r * Math.cos(sweep * Math.PI / 180), lead ? 8 : 6, { fill: lead ? T.accent : T.mute });
        s += TX(F.cx - 12, F.cy - r + 5, `${d.label} ${fmt(d.pct * k)}%`, 18, lead ? T.fg : T.fg2, { anchor: 'end', ...rise(p, 0.3 + i * 0.1) });
      });
      return s + head(p, T, { big: `${fmt(DATA.reach[0].pct * eo(seg(p, 0.15, 1.15)))}%`, bigAt: 0.15, l1: 'used ChatGPT last month', l2: 'The default, by a wide margin.' });
    } },

  /* 3 · Lanes — area-true circles (users), each tool's reason to be picked */
  { id: 'lanes', theme: 'dark', dur: 3.2, enter: { type: 'line', dir: 'down' },
    note: `% of each tool’s users · area ∝ users: 281 · 149 · 40`,
    draw(p, T) {
      let s = '';
      const g = lanesGeom();
      DATA.lanes.forEach((d, i) => {
        const k = eo(seg(p, 0.2 + i * 0.1, 0.7 + i * 0.1));
        s += C(g.xs[i], g.base - g.rs[i], g.rs[i] * k, { fill: T.accent });    // equal weight: same fill for every tool
        const lx = [F.x0, g.xs[1], F.x1][i], anchor = ['start', 'middle', 'end'][i];
        s += TX(g.xs[i], g.base - g.rs[i] + 6, `${d.pct}%`, 18, T.onAccent, { anchor: 'middle', op: seg(p, 0.6 + i * 0.1, 0.9 + i * 0.1) });   // value inside its own circle
        s += TX(lx, g.base + 36, d.tool, 18, T.fg, { anchor, ...rise(p, 0.6 + i * 0.1) });
        s += TX(lx, g.base + 60, d.lane, 18, T.fg2, { anchor, ...rise(p, 0.7 + i * 0.1) });
      });
      return s + head(p, T, { title: 'Each tool has its own job', l2: 'Habit, research, quality.', l2At: 0.3 });
    } },

  /* 4 · Verbatim — kinetic quote */
  { id: 'quote', theme: 'blue', dur: 3.4, enter: { type: 'circle', at: () => { const g = lanesGeom(); return [g.xs[2], g.base - g.rs[2]]; } },
    note: `Verbatim from interview · n${NBSP}=${NBSP}298`,
    draw(p, T) {
      let s = '';
      const q = LAY.quote, lh = 56, lines = wrap(DATA.quote.text, 40, q.max);
      s += Lk(q.x - 24, q.y0 - 44, q.x - 24, q.y0 - 44 + lines.length * lh + 8, eio(seg(p, 0, 0.5)), T.fg);
      lines.forEach((ln, i) => { s += TX(q.x, q.y0 + i * lh, ln, 40, T.fg, rise(p, 0.1 + i * 0.12, 0.3)); });
      s += TX(q.x, q.y0 + lines.length * lh + 40, DATA.quote.who, 18, T.fg, rise(p, 0.8));
      return s;
    } },

  /* 5 · Agency — ring fill */
  { id: 'limits', theme: 'light', dur: 2.6, enter: { type: 'line', dir: 'up' },
    note: `Monitor or limit their reliance · 189 of 298`,
    draw(p, T) {
      let s = '';
      const g = ringGeom(), k = eo(seg(p, 0.3, 1.9)), sweep = 360 * DATA.limits.pct / 100 * k;
      if (seg(p, 0.1, 0.4) > 0) s += C(g.cx, g.cy, g.r, { stroke: T.grid, op: seg(p, 0.1, 0.4) });
      if (sweep > 0.5) s += `<path d="${arcPath(g.cx, g.cy, g.r, 0, sweep)}" fill="none" stroke="${T.accent}" stroke-width="${LINE}"/>`;
      if (k > 0) s += C(g.cx + g.r * Math.sin(sweep * Math.PI / 180), g.cy - g.r * Math.cos(sweep * Math.PI / 180), 10, { fill: T.accent });
      s += TX(g.cx, g.cy + 8, `${fmt(DATA.limits.count * k)} of ${DATA.limits.base}`, 24, T.fg2, { anchor: 'middle', op: seg(p, 0.3, 0.6) });
      return s + head(p, T, { big: `${fmt(DATA.limits.pct * k)}%`, bigAt: 0.3, l1: 'keep their reliance in check', l2: 'They edit, verify and set limits.' });
    } },

  /* 6 · Attitudes — one axis, three dots */
  { id: 'attitudes', theme: 'dark', dur: 2.8, enter: { type: 'circle', at: () => { const g = ringGeom(), a = 360 * DATA.limits.pct / 100 * Math.PI / 180; return [g.cx + g.r * Math.sin(a), g.cy - g.r * Math.cos(a)]; } },
    note: `72% closed question · 33%, 21% coded · n${NBSP}=${NBSP}293–298`,
    draw(p, T) {
      let s = '';
      const ay = F.cy;
      s += Lk(F.x0, ay, F.x1, ay, eio(seg(p, 0.05, 0.45)), T.grid);
      s += TX(F.x0, ay + 32, '0', 18, T.fg2, { op: seg(p, 0.3, 0.6) });
      s += TX(F.x1, ay + 32, '100%', 18, T.fg2, { anchor: 'end', op: seg(p, 0.3, 0.6) });
      const spots = placeLabels(DATA.attitudes.map(d => ({ x: axisX(d.pct), name: d.label, value: `${d.pct}%` })), ay);
      DATA.attitudes.forEach((d, i) => {
        const k = eo(seg(p, 0.25 + i * 0.1, 0.85 + i * 0.1)), X = axisX(d.pct), x = lerp(F.x0, X, k);
        const { ly, ny, vy, anchor } = spots[i], lab = seg(p, 0.75 + i * 0.1, 1.05 + i * 0.1);
        s += Lk(X, ly < ay ? ay - 12 : ay + 12, X, ly, lab, T.grid);
        if (k > 0) s += d.focus ? C(x, ay, 10, { fill: T.accent }) : C(x, ay, 7, { fill: T.bg, stroke: T.fg });
        s += TX(X, ny, d.label, 18, T.fg, { anchor, op: lab });
        s += TX(X, vy, `${d.pct}%`, 18, T.fg2, { anchor, op: lab });
      });
      return s + head(p, T, { big: `${fmt(DATA.attitudes[0].pct * eo(seg(p, 0.1, 1.3)))}%`, bigAt: 0.1, l1: 'feel positive about AI', l2: 'Enthusiasm, with guardrails.' });
    } },

  /* 7 · Roles — dot-line bars, margin to margin */
  { id: 'roles', theme: 'blue', dur: 3.0, enter: { type: 'line', dir: 'down' },
    note: `Explicit mentions, coded from interviews · n${NBSP}=${NBSP}298`,
    draw(p, T) {
      let s = '';
      const max = Math.ceil(Math.max(...DATA.roles.map(d => d.pct)) / 10) * 10, X = v => F.x0 + v / max * F.w;
      const step = Math.min(72, (F.h - 60) / (DATA.roles.length - 1));
      DATA.roles.forEach((d, i) => {
        const y = F.y0 + 60 + i * step, lead = i === 0, k = eio(seg(p, 0.3 + i * 0.08, 1.0 + i * 0.08));
        s += Lk(F.x0, y, F.x1, y, eio(seg(p, 0.1 + i * 0.05, 0.5 + i * 0.05)), T.grid);
        s += TX(F.x0, y - 16, d.label, 18, lead ? T.fg : T.fg2, rise(p, 0.2 + i * 0.06));
        s += Lk(F.x0, y, X(d.pct), y, k, lead ? T.accent : T.mute);
        if (k > 0) s += C(lerp(F.x0, X(d.pct), k), y, lead ? 9 : 7, { fill: lead ? T.accent : T.mute });
        s += TX(F.x1, y - 16, `${fmt(d.pct * k)}%`, 18, lead ? T.fg : T.fg2, { anchor: 'end', op: seg(p, 0.4 + i * 0.08, 0.7 + i * 0.08) });
      });
      return s + head(p, T, { big: `${fmt(DATA.roles[0].pct * eo(seg(p, 0.3, 1.5)))}%`, bigAt: 0.3, l1: 'keep AI strictly a tool', l2: 'Only 6% call it a friend.', l2Color: T.fg2Large });
    } },

  /* 8 · Advice — slope from infrequent to daily users */
  { id: 'advice', theme: 'light', dur: 3.0, enter: { type: 'circle', at: () => [F.x0 + 9, F.y0 + 60] },
    note: `Personal advice · small infrequent group (n${NBSP}=${NBSP}32)`,
    draw(p, T) {
      let s = '';
      const a = DATA.advice, y0 = slopeY(0), yl = slopeY(a.infrequent.pct), yr = slopeY(a.daily.pct);

      s += Lk(F.x0, y0, F.x0, yl, eio(seg(p, 0.2, 0.5)), T.grid);

  { id: 'cohorts', theme: 'dark', dur: 3.0, enter: { type: 'line', dir: 'up' },

      s += `<g transform="translate(${r2(lxx)} ${E.logo.y}) scale(${r2(28 / 71 * 1000) / 1000})" opacity="${r2(w)}" fill="${T.fg}">${WORDMARK}</g>`;
      s += TX(E.study.x, E.study.y, `${DATA.study} · n${NBSP}=${NBSP}${DATA.n}`, 16, T.fg, { anchor: E.study.anchor, op: w });

/* Source notes must fit one line inside the content box at every ratio */
SCENES.forEach(sc => { if (sc.note && textW(sc.note, 16) > R - M) console.warn(`Note too long for ${ASPECT} (${sc.id}): shorten it`); });

/* ===== Timeline ===== */
let acc = 0;
SCENES.forEach(s => { s.start = acc; acc += s.dur; });
const TOTAL = acc;

/* Scene layer: background, content, credit line, source note — optionally scaled for the punch-in */
function layer(scene, p, scale = 1) {
  const T = TH[scene.theme];
  const tf = scale !== 1 ? ` transform="translate(${W / 2} ${H / 2}) scale(${r2(scale * 1000) / 1000}) translate(${-W / 2} ${-H / 2})"` : '';
  return `<g${tf}>` +
    `<rect x="-40" y="-40" width="${W + 80}" height="${H + 80}" fill="${T.bg}"/>` +
    scene.draw(p, T) +
    (scene.id === 'end' ? '' : `<text x="${W / 2}" y="${LAY.credit}" font-size="${CREDIT_SIZE}" text-anchor="middle"><tspan fill="${T.fg2}">Listen Labs /</tspan> <tspan fill="${T.fg}">${TITLE}</tspan></text>`) +
    (scene.note ? TX(M, LAY.note, scene.note, 16, T.fg2) : '') +
    `</g>`;
}

function frame(t) {
  t = Math.max(0, Math.min(TOTAL - 1e-6, t));
  let i = SCENES.findIndex(s => t < s.start + s.dur);
  if (i < 0) i = SCENES.length - 1;
  const s = SCENES[i], p = t - s.start;
  if (i === 0 || p >= TRANSITION || !s.enter) return layer(s, p);

  const prev = SCENES[i - 1], k = eio(p / TRANSITION), T = TH[s.theme];
  let clip, edge;
  if (s.enter.type === 'circle') {
    const [x, y] = s.enter.at();
    const far = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([cx, cy]) => Math.hypot(cx - x, cy - y)));
    const r = far * k;
    clip = `<circle cx="${x}" cy="${y}" r="${r2(r)}"/>`;
    edge = C(x, y, r, { stroke: T.fg, sw: 2 });
  } else {
    const d = s.enter.dir;
    if (d === 'down')  { const h = H * k; clip = `<rect x="0" y="0" width="${W}" height="${r2(h)}"/>`; edge = L(0, h, W, h, T.fg, 2); }
    if (d === 'up')    { const y = H * (1 - k); clip = `<rect x="0" y="${r2(y)}" width="${W}" height="${r2(H - y)}"/>`; edge = L(0, y, W, y, T.fg, 2); }
    if (d === 'right') { const w = W * k; clip = `<rect x="0" y="0" width="${r2(w)}" height="${H}"/>`; edge = L(w, 0, w, H, T.fg, 2); }
  }
  return `<defs><clipPath id="wipe">${clip}</clipPath></defs>` +
    layer(prev, prev.dur + p, 1 + 0.04 * k) +
    `<g clip-path="url(#wipe)">${layer(s, p, 1 + 0.06 * (1 - k))}</g>` +
    edge;
}

/* ===== Player ===== */
const stage = document.getElementById('stage');
stage.setAttribute('viewBox', `0 0 ${W} ${H}`);
const frameEl = document.querySelector('.stage-frame');
frameEl.style.aspectRatio = `${W} / ${H}`;
if (W > H) { frameEl.style.width = 'min(100%, 768px)'; document.querySelector('.controls').style.width = 'min(100%, 768px)'; }
function renderFrame(t) { stage.innerHTML = frame(t); }
window.renderFrame = renderFrame;
window.TOTAL = TOTAL;
window.FPS = FPS;

const params = new URLSearchParams(location.search);
if (params.has('export')) {
  document.body.classList.add('export');
  frameEl.style.width = `${W}px`; frameEl.style.height = `${H}px`;
  renderFrame(0);
} else {
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = false, cur = 0, last = 0;
  scrub.max = TOTAL;
  const show = t => { cur = t; renderFrame(t); scrub.value = t; time.textContent = `${t.toFixed(1)} / ${TOTAL.toFixed(1)} s`; };
  const tick = now => {
    if (!playing) return;
    cur += (now - last) / 1000; last = now;
    if (cur >= TOTAL) cur = 0;           // loop like a short
    show(cur);
    requestAnimationFrame(tick);
  };
  const setPlaying = on => {
    playing = on; playBtn.textContent = on ? 'Pause' : 'Play';
    if (on) { last = performance.now(); requestAnimationFrame(tick); }
  };
  playBtn.addEventListener('click', () => setPlaying(!playing));
  scrub.addEventListener('input', () => { setPlaying(false); show(+scrub.value); });
  // Scene steppers land on each scene’s settled final state (no-motion path)
  const settled = i => SCENES[i].start + SCENES[i].dur - 0.05;
  const sceneAt = t => Math.max(0, SCENES.findIndex(s => t < s.start + s.dur));
  document.getElementById('prev').addEventListener('click', () => { setPlaying(false); show(settled(Math.max(0, sceneAt(cur) - 1))); });
  document.getElementById('next').addEventListener('click', () => { setPlaying(false); show(settled(Math.min(SCENES.length - 1, sceneAt(cur) + 1))); });
  if (reduce) show(settled(0)); else { show(0); setPlaying(true); }
}
