<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F9F4EB">
  <title>Listen Labs / Chart Title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: light dark; }
    h1, h2, h3 { text-wrap: balance; }
    p, figcaption { text-wrap: pretty; }
    .chart-sub, figcaption, .tabular { font-variant-numeric: tabular-nums; }
    :focus-visible {
      outline: 2px solid var(--content-primary);
      outline-offset: 2px;
    }

    /* @brand-tokens:start */

    /* GENERATED from brand_data.py by generate_skeleton_tokens.py — do not edit by hand.

     * Themes: paper (default) + whisp. Pick one per artifact with data-theme on <html>.

     * Mode: follows the OS via prefers-color-scheme; force with data-mode="light|dark" on <html>.

     * Print always uses the chosen theme's light tokens. Token NAMES are identical across themes. */

    :root {
      /* Paper — light (default) */
      --content-primary: #120F08;
      --content-secondary: #6B6861;
      --content-inverse-primary: #F9F4EB;
      --content-inverse-secondary: #9E9B94;
      --content-disabled: #B6B4AF;
      --content-inverse-disabled: #504E49;
      --content-brand: #0021CC;
      --content-brand-secondary: #7A85B8;
      --content-brand-contrast: #F9F4EB;
      --content-brand-contrast-secondary: #9CA3C9;
      --content-complimentary: #B88114;
      --content-warning: #B85814;
      --content-negative: #B82214;
      --content-positive: #0F8A38;
      --surface-highlight: #FBF9F4;
      --surface-primary: #F9F4EB;
      --surface-secondary: #EEE8DD;
      --surface-tertiary: #E2DCCF;
      --surface-inverse-primary: #120F08;
      --surface-inverse-secondary: #1F1B14;
      --surface-brand-primary: #0021CC;
      --surface-brand-secondary: #D9DDF2;
      --surface-complimentary-primary: #E5A119;
      --surface-complimentary-secondary: #F5EBD6;
      --surface-warning-primary: #CF6317;
      --surface-warning-secondary: #F5E3D6;
      --surface-negative-primary: #CF2617;
      --surface-negative-secondary: #F5D9D6;
      --surface-positive-primary: #14B84B;
      --surface-positive-secondary: #D6F5E0;

      /* Emotion tokens — reserved for the six Ekman emotions */
      --emotion-anger-primary: #BF4040;
      --emotion-anger-secondary: rgba(191, 64, 64, 0.10);
      --emotion-happiness-primary: #D99E26;
      --emotion-happiness-secondary: rgba(217, 158, 38, 0.10);
      --emotion-disgust-primary: #80BF40;
      --emotion-disgust-secondary: rgba(128, 191, 64, 0.10);
      --emotion-surprise-primary: #40BFAA;
      --emotion-surprise-secondary: rgba(64, 191, 170, 0.10);
      --emotion-sadness-primary: #406ABF;
      --emotion-sadness-secondary: rgba(64, 106, 191, 0.10);
      --emotion-fear-primary: #9540BF;
      --emotion-fear-secondary: rgba(149, 64, 191, 0.10);
    }

    :root[data-theme="whisp"] {
      /* Whisp — light (tokens that differ from paper) */
      --content-primary: #1A1A1A;
      --content-secondary: #666666;
      --content-inverse-primary: #E5E5E5;
      --content-inverse-secondary: #999999;
      --content-disabled: #B2B2B2;
      --content-inverse-disabled: #4D4D4D;
      --content-brand-contrast: #E5E5E5;
      --surface-highlight: #FFFFFF;
      --surface-primary: #FAFAFA;
      --surface-secondary: #F0F0F0;
      --surface-tertiary: #E0E0E0;
      --surface-inverse-primary: #1A1A1A;
      --surface-inverse-secondary: #262626;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-mode="light"]) {
        /* Paper — dark (tokens that differ from light) */
        --content-primary: #F9F4EB;
        --content-secondary: #9E9B94;
        --content-inverse-primary: #120F08;
        --content-inverse-secondary: #6B6861;
        --content-disabled: #504E49;
        --content-inverse-disabled: #B6B4AF;
        --content-brand: #3354FF;
        --surface-highlight: #080603;
        --surface-primary: #130F06;
        --surface-secondary: #201C13;
        --surface-tertiary: #30291D;
        --surface-inverse-primary: #F9F4EB;
        --surface-inverse-secondary: #F0E9DB;
        --surface-brand-secondary: #131939;
      }
      :root[data-theme="whisp"]:not([data-mode="light"]) {
        /* Whisp — dark */
        --content-primary: #E5E5E5;
        --content-secondary: #999999;
        --content-inverse-primary: #1A1A1A;
        --content-inverse-secondary: #666666;
        --content-disabled: #4D4D4D;
        --content-inverse-disabled: #B2B2B2;
        --content-brand: #3354FF;
        --surface-highlight: #000000;
        --surface-primary: #1A1A1A;
        --surface-secondary: #262626;
        --surface-tertiary: #333333;
        --surface-inverse-primary: #FAFAFA;
        --surface-inverse-secondary: #F0F0F0;
        --surface-brand-secondary: #131939;
      }
    }

    :root[data-mode="dark"] {
      --content-primary: #F9F4EB;
      --content-secondary: #9E9B94;
      --content-inverse-primary: #120F08;
      --content-inverse-secondary: #6B6861;
      --content-disabled: #504E49;
      --content-inverse-disabled: #B6B4AF;
      --content-brand: #3354FF;
      --surface-highlight: #080603;
      --surface-primary: #130F06;
      --surface-secondary: #201C13;
      --surface-tertiary: #30291D;
      --surface-inverse-primary: #F9F4EB;
      --surface-inverse-secondary: #F0E9DB;
      --surface-brand-secondary: #131939;
    }
    :root[data-theme="whisp"][data-mode="dark"] {
      --content-primary: #E5E5E5;
      --content-secondary: #999999;
      --content-inverse-primary: #1A1A1A;
      --content-inverse-secondary: #666666;
      --content-disabled: #4D4D4D;
      --content-inverse-disabled: #B2B2B2;
      --content-brand: #3354FF;
      --surface-highlight: #000000;
      --surface-primary: #1A1A1A;
      --surface-secondary: #262626;
      --surface-tertiary: #333333;
      --surface-inverse-primary: #FAFAFA;
      --surface-inverse-secondary: #F0F0F0;
      --surface-brand-secondary: #131939;
    }

    @media print {
      :root, :root:not([data-mode="light"]), :root[data-mode="dark"] {
        --content-primary: #120F08;
        --content-secondary: #6B6861;
        --content-inverse-primary: #F9F4EB;
        --content-inverse-secondary: #9E9B94;
        --content-disabled: #B6B4AF;
        --content-inverse-disabled: #504E49;
        --content-brand: #0021CC;
        --content-brand-secondary: #7A85B8;
        --content-brand-contrast: #F9F4EB;
        --content-brand-contrast-secondary: #9CA3C9;
        --content-complimentary: #B88114;
        --content-warning: #B85814;
        --content-negative: #B82214;
        --content-positive: #0F8A38;
        --surface-highlight: #FBF9F4;
        --surface-primary: #F9F4EB;
        --surface-secondary: #EEE8DD;
        --surface-tertiary: #E2DCCF;
        --surface-inverse-primary: #120F08;
        --surface-inverse-secondary: #1F1B14;
        --surface-brand-primary: #0021CC;
        --surface-brand-secondary: #D9DDF2;
        --surface-complimentary-primary: #E5A119;
        --surface-complimentary-secondary: #F5EBD6;
        --surface-warning-primary: #CF6317;
        --surface-warning-secondary: #F5E3D6;
        --surface-negative-primary: #CF2617;
        --surface-negative-secondary: #F5D9D6;
        --surface-positive-primary: #14B84B;
        --surface-positive-secondary: #D6F5E0;
      }
      :root[data-theme="whisp"], :root[data-theme="whisp"]:not([data-mode="light"]), :root[data-theme="whisp"][data-mode="dark"] {
        --content-primary: #1A1A1A;
        --content-secondary: #666666;
        --content-inverse-primary: #E5E5E5;
        --content-inverse-secondary: #999999;
        --content-disabled: #B2B2B2;
        --content-inverse-disabled: #4D4D4D;
        --content-brand-contrast: #E5E5E5;
        --surface-highlight: #FFFFFF;
        --surface-primary: #FAFAFA;
        --surface-secondary: #F0F0F0;
        --surface-tertiary: #E0E0E0;
        --surface-inverse-primary: #1A1A1A;
        --surface-inverse-secondary: #262626;
      }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @page { size: auto; margin: 16mm; }
    }

    /* Data-viz palette tokens — brand mode (default) */
    :root,
    [data-dataviz-palette="brand"] {
      --dataviz-categorical-1: hsl(229, 100%, 40%);
      --dataviz-categorical-2: hsl(229, 100%, 60%);
      --dataviz-categorical-3: hsl(229, 100%, 25%);
      --dataviz-categorical-4: hsl(229, 100%, 78%);
      --dataviz-categorical-5: hsl(229, 100%, 50%);
      --dataviz-categorical-6: #525252;
      --dataviz-categorical-7: #8D8D8D;
      --dataviz-categorical-8: #C6C6C6;
      --dataviz-sequential-100: hsl(229, 100%, 92%);
      --dataviz-sequential-200: hsl(229, 100%, 82%);
      --dataviz-sequential-300: hsl(229, 100%, 70%);
      --dataviz-sequential-400: hsl(229, 100%, 55%);
      --dataviz-sequential-500: hsl(229, 100%, 40%);
      --dataviz-sequential-600: hsl(229, 100%, 28%);
      --dataviz-sequential-700: hsl(229, 100%, 18%);
      --dataviz-diverging-neg-3: hsl(27, 100%, 42%);
      --dataviz-diverging-neg-2: hsl(27, 100%, 62%);
      --dataviz-diverging-neg-1: hsl(27, 75%, 86%);
      --dataviz-diverging-zero: #F5F5F5;
      --dataviz-diverging-pos-1: hsl(229, 75%, 86%);
      --dataviz-diverging-pos-2: hsl(229, 100%, 62%);
      --dataviz-diverging-pos-3: #0021CC;
      --dataviz-highlight-accent: #0021CC;
      --dataviz-highlight-neutral-1: #525252;
      --dataviz-highlight-neutral-2: #8D8D8D;
      --dataviz-highlight-neutral-3: #C6C6C6;
      --dataviz-semantic-positive: #0F8A38;
      --dataviz-semantic-negative: #B82214;
      --dataviz-semantic-neutral: #8D8D8D;
    }

    /* Data-viz palette tokens — global (best-practices) mode */
    [data-dataviz-palette="global"] {
      --dataviz-categorical-1: #0072B2;
      --dataviz-categorical-2: #E69F00;
      --dataviz-categorical-3: #009E73;
      --dataviz-categorical-4: #CC79A7;
      --dataviz-categorical-5: #56B4E9;
      --dataviz-categorical-6: #D55E00;
      --dataviz-categorical-7: #F0E442;
      --dataviz-categorical-8: #000000;
      --dataviz-sequential-100: #440154;
      --dataviz-sequential-200: #443A83;
      --dataviz-sequential-300: #31688E;
      --dataviz-sequential-400: #21908C;
      --dataviz-sequential-500: #35B779;
      --dataviz-sequential-600: #8FD744;
      --dataviz-sequential-700: #FDE725;
      --dataviz-diverging-neg-3: #B2182B;
      --dataviz-diverging-neg-2: #EF8A62;
      --dataviz-diverging-neg-1: #FDDBC7;
      --dataviz-diverging-zero: #F7F7F7;
      --dataviz-diverging-pos-1: #D1E5F0;
      --dataviz-diverging-pos-2: #67A9CF;
      --dataviz-diverging-pos-3: #2166AC;
      --dataviz-highlight-accent: #0072B2;
      --dataviz-highlight-neutral-1: #525252;
      --dataviz-highlight-neutral-2: #8D8D8D;
      --dataviz-highlight-neutral-3: #C6C6C6;
      --dataviz-semantic-positive: #0F8A38;
      --dataviz-semantic-negative: #B82214;
      --dataviz-semantic-neutral: #8D8D8D;
    }

    /* @brand-tokens:end */

    .chart-unavailable { font-size: 12px; line-height: 16px; color: var(--content-secondary); padding: 24px; border: 1px solid var(--surface-tertiary); border-radius: 8px; }

    /* ── Base ──────────────────────────────────────────────── */
    /* The artifact responds to its CONTAINER (a product-canvas pane, an embed), not the screen. */
    body { container-type: inline-size; }
    body {
      font-family: 'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif;
      font-weight: 400;
      background: var(--surface-primary);
      color: var(--content-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Branded Header ───────────────────────────────────── */
    .ll-header {
      text-align: center;
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      font-size: 12px;
      font-weight: 400;
    }
    .ll-header .ll-brand { color: var(--content-secondary); }
    .ll-header .ll-title { color: var(--content-primary); }

    /* ── Chart Container ──────────────────────────────────── */
    main {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 24px 48px;
    }

    /* Title states the finding; subtitle names metric, unit, timeframe and n. */
    .chart-head { margin-bottom: 16px; }
    .chart-head h1 { font-size: 16px; line-height: 24px; color: var(--content-primary); }
    .chart-sub { font-size: 12px; line-height: 16px; color: var(--content-secondary); margin-top: 4px; }

    figure {
      position: relative;
      width: 100%;
      height: 400px;            /* re-laid out per container width below — never left to distort */
    }
    @container (max-width: 600px) { figure { height: 280px; } }
    @supports not (container-type: inline-size) { @media (max-width: 600px) { figure { height: 280px; } } }

    figcaption {
      font-size: 12px;
      line-height: 16px;
      color: var(--content-disabled);
      margin-top: 12px;
      text-align: left;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Print ─────────────────────────────────────────────── */
    @media print {
      body { background: #fff; }
      .ll-header { position: static; margin-bottom: 24px; }
      figure { break-inside: avoid; }
      main { padding-top: 0; }
    }

    /* ── Reduced Motion ────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0s !important; transition-duration: 0s !important; }
    }
  </style>
</head>
<body>

  <!-- Branded header — keep for standalone files/exports; DELETE this element (and the body/main top padding that makes room for it) when the artifact lives inside the Listen Labs product canvas -->
  <div class="ll-header">
    <span class="ll-brand">Listen Labs /</span>
    <span class="ll-title"> Chart Title</span>
  </div>

  <!--
    Palette mode: change `data-dataviz-palette` to "global" to swap every
    chart inside <main> from monochromatic brand-blue to the brand-agnostic
    best-practices palette (Okabe-Ito categorical, Viridis sequential,
    ColorBrewer RdBu diverging). Token names are identical across modes.
  -->
  <main data-dataviz-palette="brand">
    <header class="chart-head">
      <h1>Finding stated as a sentence, not the metric name</h1>
      <p class="chart-sub">Metric · unit · timeframe · n&nbsp;=&nbsp;24</p>
    </header>
    <figure>
      <canvas id="chart" role="img" aria-label="Description of the chart data"></canvas>
      <figcaption><!-- Optional caption --></figcaption>
    </figure>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4" onerror="document.querySelectorAll('canvas').forEach(function(c){var m=document.createElement('p');m.className='chart-unavailable';m.textContent='Chart could not load (no network). Open this file online to see the visualization.';c.hidden=true;c.insertAdjacentElement('afterend',m);})"></script>
  <script>
    // If Chart.js failed to load (offline), the <script onerror> above already swapped each canvas
    // for a visible notice. This stub absorbs every Chart.* call so the rest of the page still works.
    if (typeof Chart === 'undefined') {
      var __chartStub = new Proxy(function () {}, { get: function (t, k) { return k === 'prototype' ? t.prototype : __chartStub; }, apply: function () { return __chartStub; }, construct: function () { return __chartStub; } });
      window.Chart = __chartStub;
    }
    // ── Disable animations globally ────────────────────────
    Chart.defaults.animation = false;

    // ── Read brand tokens from CSS variables ───────────────
    var style = getComputedStyle(document.documentElement);
    var contentPrimary = style.getPropertyValue('--content-primary').trim();
    var contentSecondary = style.getPropertyValue('--content-secondary').trim();
    var contentDisabled = style.getPropertyValue('--content-disabled').trim();

    // ── Global Chart.js defaults ───────────────────────────
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.font.weight = 400;
    Chart.defaults.font.size = 12;
    Chart.defaults.color = contentPrimary;

    // ── Monochromatic shade generator ──────────────────────
    // @dataviz-helpers:start
    // GENERATED by generate_skeleton_tokens.py — palette-mode-aware helpers. Do not edit by hand.
    // Each helper resolves --dataviz-* tokens against the chart's nearest [data-dataviz-palette] ancestor,
    // so the same chart code renders in brand or global mode by flipping one attribute.
    function dataVizScope(el) {
      return (el && el.closest && el.closest('[data-dataviz-palette]')) || document.documentElement;
    }
    function dataVizToken(scope, name) {
      return getComputedStyle(scope).getPropertyValue(name).trim();
    }
    function dataVizSeries(count, el) {
      // Categorical: slots 1..8 in order. Brand mode is designed for ≤5 (6–8 are neutral grays);
      // beyond 8 there are no more distinct tokens — roll the data up to "Other" instead of wrapping.
      var scope = dataVizScope(el), out = [];
      if (count > 8) console.warn('dataVizSeries: ' + count + ' series exceeds the 8-slot palette — roll up to "Other".');
      for (var i = 0; i < Math.min(count, 8); i++) out.push(dataVizToken(scope, '--dataviz-categorical-' + (i + 1)));
      return out;
    }
    function dataVizSequential(count, el) {
      // Ordered/continuous data: `count` evenly spaced stops from the 7-stop ramp (100 lightest → 700 darkest).
      // A single value gets the mid (500) stop so it is visible on the canvas.
      var scope = dataVizScope(el), stops = [100, 200, 300, 400, 500, 600, 700];
      if (count <= 1) return [dataVizToken(scope, '--dataviz-sequential-500')];
      if (count >= 7) return stops.map(function (s) { return dataVizToken(scope, '--dataviz-sequential-' + s); });
      var picked = [];
      for (var i = 0; i < count; i++) picked.push(dataVizToken(scope, '--dataviz-sequential-' + stops[Math.round(i * 6 / (count - 1))]));
      return picked;
    }
    function dataVizDiverging(el) {
      // Data with a meaningful midpoint: 7 stops neg-3 … zero … pos-3.
      var scope = dataVizScope(el);
      return ['neg-3', 'neg-2', 'neg-1', 'zero', 'pos-1', 'pos-2', 'pos-3'].map(function (k) { return dataVizToken(scope, '--dataviz-diverging-' + k); });
    }
    function dataVizHighlight(el) {
      // One focal series + de-emphasized rest.
      var scope = dataVizScope(el);
      return { accent: dataVizToken(scope, '--dataviz-highlight-accent'),
               neutral: [1, 2, 3].map(function (n) { return dataVizToken(scope, '--dataviz-highlight-neutral-' + n); }) };
    }
    function dataVizSemantic(el) {
      var scope = dataVizScope(el);
      return { positive: dataVizToken(scope, '--dataviz-semantic-positive'),
               negative: dataVizToken(scope, '--dataviz-semantic-negative'),
               neutral: dataVizToken(scope, '--dataviz-semantic-neutral') };
    }
    function dataVizTextTokens() {
      // Re-read text/grid colors (call again on theme change and pass into chart.update()).
      var s = getComputedStyle(document.documentElement);
      return { primary: s.getPropertyValue('--content-primary').trim(),
               secondary: s.getPropertyValue('--content-secondary').trim(),
               disabled: s.getPropertyValue('--content-disabled').trim(),
               surface: s.getPropertyValue('--surface-highlight').trim(),
               hairline: s.getPropertyValue('--surface-tertiary').trim() };
    }
    // @dataviz-helpers:end

    // ── Chart ──────────────────────────────────────────────
    var canvas = document.getElementById('chart');
    var ctx = canvas.getContext('2d');
    var accent = dataVizHighlight(canvas).accent;   // single series → highlight accent (never a raw surface token)
    var text = dataVizTextTokens();
    var chart = new Chart(ctx, {
      type: 'bar', // or 'line'
      data: {
        labels: ['Label 1', 'Label 2', 'Label 3', 'Label 4'],
        datasets: [{
          label: 'Series 1',
          data: [10, 20, 30, 40],
          backgroundColor: accent,
          borderColor: accent,
          borderWidth: 1,
          borderRadius: 2,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false,          // one series: the title carries the label; direct labels beat legends
            position: 'top',
            labels: {
              font: { family: "'Inter', sans-serif", weight: 400, size: 12 },
              color: contentPrimary,
              padding: 16,
              boxWidth: 12,
              boxHeight: 12,
              useBorderRadius: true,
              borderRadius: 2,
            }
          },
          tooltip: {
            backgroundColor: text.surface,     // light card per components.md → Tooltips
            borderColor: text.hairline,
            borderWidth: 1,
            titleColor: text.primary,
            bodyColor: text.secondary,
            bodyFont: { family: "'Inter', sans-serif", weight: 400, size: 12 },
            titleFont: { family: "'Inter', sans-serif", weight: 400, size: 10 },
            padding: 12,
            cornerRadius: 8,
            displayColors: true,
            boxWidth: 8,
            boxHeight: 8,
            boxPadding: 4,
          }
        },
        scales: {
          x: {
            grid: { display: false },
            border: { display: false },
            ticks: {
              font: { family: "'Inter', sans-serif", weight: 400, size: 10 },
              color: contentSecondary,
              padding: 8,
            }
          },
          y: {
            grid: {
              color: contentDisabled,
              lineWidth: 1,
              drawTicks: false,
            },
            border: { display: false },
            ticks: {
              font: { family: "'Inter', sans-serif", weight: 400, size: 10 },
              color: contentSecondary,
              padding: 8,
            }
          }
        }
      }
    });

    // ── Theme changes: re-read tokens and repaint (Chart.js bakes colors into the canvas) ──
    function repaintCharts() {
      var t = dataVizTextTokens();
      Chart.defaults.color = t.primary;
      (Chart.instances ? Object.values(Chart.instances) : [chart]).forEach(function (c) {
